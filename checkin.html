<style>
  :root{

  .stat .n small{font-size:14px;font-weight:600;margin-left:3px;color:var(--gold)}

  /* ── 簽到鈕 ── */
  .btn{
    display:block;width:100%;margin-top:22px;

  }
  .stamp.on{animation:stampIn .62s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes stampIn{
    0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-14deg)}
    60%{opacity:.92;transform:translate(-50%,-50%) scale(1) rotate(-9deg)}
    100%{opacity:.85;transform:translate(-50%,-50%) scale(1) rotate(-9deg)}
  }

  /* ── 排行榜 ── */
  .board{margin-top:34px}
  .board h2{
    font-size:13px;font-weight:700;letter-spacing:.22em;color:var(--gold-deep);
    padding-left:11px;position:relative;margin-bottom:14px;
  }
  .board h2::before{
    content:"";position:absolute;left:0;top:.3em;bottom:.3em;width:3px;border-radius:2px;
    background:linear-gradient(180deg,#D9B23F,var(--gold));
  }
  .board table{width:100%;border-collapse:collapse;font-size:13px}
  .board th{
    text-align:left;font-weight:400;font-size:11px;letter-spacing:.14em;color:var(--ink-3);
    padding:0 0 9px;border-bottom:1px solid var(--line);
  }
  .board th.r,.board td.r{text-align:right}
  .board td{padding:11px 0;border-bottom:1px solid rgba(184,145,42,.13);color:var(--ink-2)}
  .board tr.me td{background:rgba(217,178,63,.10);font-weight:700;color:var(--gold-deep)}
  .board tr.me td:first-child{border-radius:8px 0 0 8px;padding-left:8px}
  .board tr.me td:last-child{border-radius:0 8px 8px 0;padding-right:8px}
  .rank{width:34px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .rank.top1,.rank.top2,.rank.top3{font-weight:800;color:var(--gold)}
  .nm{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st{width:74px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .st b{color:var(--gold-deep);font-size:15px}
  .board .empty{padding:20px 0;text-align:center;font-size:13px;color:var(--ink-3)}
  .board .off{padding:16px 0;text-align:center;font-size:11.5px;line-height:1.9;color:var(--ink-3)}

  footer{
    margin-top:40px;padding-top:18px;border-top:1px solid var(--line);
    font-size:11px;line-height:1.95;color:var(--ink-3);text-align:center;
  }
  footer a{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.stamp.on{animation:none;opacity:.85;transform:translate(-50%,-50%) rotate(-9deg)}}
</style>

<body>
<div class="wrap">

  <h1>學生簽到</h1>
  <div class="sub">香港奶龍中學 · 每日簽到</div>

  <div class="card">
    <div class="stamp" id="stamp">已簽到</div>

    <div class="card-head">
      <img class="crest" src="crest-672.webp" alt="香港奶龍中學校徽" decoding="async">
      <div>
        <div class="t1">香港奶龍中學</div>
        <div class="t2">STUDENT ATTENDANCE</div>
      </div>
      <div class="no">
        學號
        <b id="sid">—</b>
      </div>
    </div>

    <div class="fields">
      <div class="row">
        <span class="k">姓名</span>
        <span class="v" id="nameCell">
          <span class="nickwrap">
            <input id="nick" type="text" maxlength="12" placeholder="輸入你的暱稱" autocomplete="off">
            <button id="saveNick" type="button">確定</button>
          </span>
        </span>
      </div>
      <div class="row"><span class="k">班別</span><span class="v">中四甲</span></div>
      <div class="row"><span class="k">狀態</span><span class="v" id="statusCell">未簽到</span></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="n"><span id="streak">0</span><small>天</small></div><div class="l">連續簽到</div></div>
      <div class="stat"><div class="n" id="total">0</div><div class="l">總簽到</div></div>
      <div class="stat"><div class="n" id="best">0</div><div class="l">最長連續</div></div>
    </div>
  </div>

  <button class="btn" id="checkin" type="button">今 日 簽 到</button>
  <div class="hint" id="hint">每日簽到一次，斷簽會重新計算。</div>

  <section class="board">
    <h2>全校排行榜</h2>
    <div id="boardBody">
      <div class="empty">載入中…</div>
    </div>
  </section>

  <footer>
    本站純屬校友私人玩笑，並非任何學校之官方網站，與任何學校亦無關聯。<br>
    香港奶龍中學（簡體：香港奶龙中学）· 學生簽到頁<br>
    排行榜資料公開可見，請勿填寫真實姓名或個人資料。<br>
    <a href="./">回到主頁</a>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var LS_KEY = 'nlsc-attendance-v1';
  var API_CHECKIN = '/api/checkin';
  var API_BOARD = '/api/leaderboard';

  var $ = function (id) { return document.getElementById(id); };
  var btn = $('checkin'), hint = $('hint'), stamp = $('stamp');
  var nick = $('nick'), saveNick = $('saveNick'), nameCell = $('nameCell');
  var statusCell = $('statusCell'), sidEl = $('sid');
  var streakEl = $('streak'), totalEl = $('total'), bestEl = $('best');
  var boardBody = $('boardBody');

  /* ---------- 本地資料 ---------- */
  var me = load();
  save();   // 立刻落地一次：讓裝置 ID 在第一次互動前就固定下來

  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    // 第一次來：產生一個裝置 ID（不是帳號，清了瀏覽器就沒了）
    var uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    return { uid: uid, nickname: '', streak: 0, best: 0, total: 0, last: '' };
  }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(me)); } catch (e) {}
  }

  /* ---------- 日期（用香港時區，避免跨時區簽到錯亂） ---------- */
  function hkDate(offset) {
    var d = new Date(Date.now() + (offset || 0) * 86400000);
    // 轉成香港時間再取日期
    var s = d.toLocaleDateString('en-CA', { timeZone: 'Asia/Hong_Kong' }); // YYYY-MM-DD
    return s;
  }
  function today() { return hkDate(0); }
  function yesterday() { return hkDate(-1); }
  function isCheckedIn() { return me.last === today(); }

  /* ---------- 顯示 ---------- */
  function render() {
    streakEl.textContent = me.streak;
    totalEl.textContent = me.total;
    bestEl.textContent = me.best;
    sidEl.textContent = me.uid.slice(-6).toUpperCase();

    if (me.nickname) {
      nameCell.innerHTML = '';
      var t = document.createElement('span');
      t.textContent = me.nickname;
      nameCell.appendChild(t);
    }

    if (isCheckedIn()) {
      btn.disabled = true;
      btn.textContent = '今 日 已 簽 到';
      statusCell.textContent = '已簽到 · ' + today();
      hint.textContent = '明天再來，連續天數就會 +1。';
      stamp.classList.add('on');
    } else {
      btn.disabled = false;
      btn.textContent = '今 日 簽 到';
      statusCell.textContent = '未簽到';
      hint.textContent = me.last === yesterday()
        ? '昨日已簽，今日簽到可累積連續天數。'
        : '每日簽到一次，斷簽會重新計算。';
    }
  }

  /* ---------- 簽到 ---------- */
  function doCheckin() {
    if (isCheckedIn()) return;
    if (!me.nickname) {
      hint.textContent = '請先填一個暱稱，這樣才會出現在排行榜上。';
      nick.focus();
      return;
    }
    var t = today();
    me.streak = (me.last === yesterday()) ? me.streak + 1 : 1;
    me.total += 1;
    if (me.streak > me.best) me.best = me.streak;
    me.last = t;
    save();
    render();
    push();
  }

  /* ---------- 上報（失敗也不影響本地） ---------- */
  function push() {
    fetch(API_CHECKIN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        uid: me.uid, nickname: me.nickname,
        streak: me.streak, total: me.total, best: me.best, last: me.last
      })
    }).then(function () { loadBoard(); }).catch(function () { /* 離線也能用 */ });
  }

  /* ---------- 排行榜 ---------- */
  function loadBoard() {
    fetch(API_BOARD, { headers: { 'Accept': 'application/json' } })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) { drawBoard(d.rows || []); })
      .catch(function () {
        boardBody.innerHTML = '<div class="off">排行榜暫時連不上。<br>你的簽到紀錄已經存在這部裝置上，不會不見。</div>';
      });
  }

  function drawBoard(rows) {
    if (!rows.length) {
      boardBody.innerHTML = '<div class="empty">暫時未有人簽到，你可以係第一個。</div>';
      return;
    }
    var h = '<table><thead><tr><th class="rank">#</th><th>暱稱</th><th class="r">連續</th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var isMe = r.uid === me.uid;
      var cls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      h += '<tr' + (isMe ? ' class="me"' : '') + '>';
      h += '<td class="rank ' + cls + '">' + (i + 1) + '</td>';
      h += '<td class="nm">' + esc(r.nickname) + (isMe ? ' （你）' : '') + '</td>';
      h += '<td class="r st"><b>' + num(r.streak) + '</b> 天</td>';
      h += '</tr>';
    }
    h += '</tbody></table>';
    boardBody.innerHTML = h;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function num(n) {
    n = parseInt(n, 10);
    return isNaN(n) ? 0 : n;
  }

  /* ---------- 暱稱 ---------- */
  saveNick.addEventListener('click', function () {
    var v = (nick.value || '').trim().replace(/\s+/g, ' ').slice(0, 12);
    if (!v) { hint.textContent = '暱稱不能空白。'; return; }
    me.nickname = v;
    save();
    render();
    if (isCheckedIn()) push();     // 已簽到但改了名 → 同步上去
    hint.textContent = '好，叫「' + v + '」。';
  });
  nick.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); saveNick.click(); }
  });

  btn.addEventListener('click', doCheckin);

  /* ---------- 啟動 ---------- */
  if (me.nickname) { nick.value = me.nickname; }
  render();
  loadBoard();
})();
</script>
</body>
</html>
