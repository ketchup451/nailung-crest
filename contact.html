<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聯繫作者</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FCF8EC">
<link rel="icon" href="crest-256.png">

<!-- Cloudflare Web Analytics（無 cookie，不需同意橫幅） -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "5b4d5e258c2c41bcaa155d3bc7734e5f"}'></script>
<!-- End Cloudflare Web Analytics -->
<style>
  :root{--paper:#FCF8EC;--gold:#B8912A;--gold-deep:#8A6A12;
        --ink:#2E2517;--ink-2:#6B5C3E;--ink-3:#8A7C60}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(120% 62% at 50% -8%, #F6E7BE 0%, #FBF5E4 52%, #FCF8EC 100%) #FCF8EC;
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:56px 22px 64px;
  }
  main{max-width:560px;width:100%;text-align:center}

  h1{
    font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
    font-size:clamp(40px,12vw,72px);font-weight:700;
    letter-spacing:.10em;text-indent:.10em;color:var(--gold-deep);
    line-height:1.2;
    animation:pop .5s cubic-bezier(.22,1.4,.5,1) both;
  }
  @keyframes pop{
    0%{opacity:0;transform:scale(1.5) rotate(-3deg)}
    100%{opacity:1;transform:none}
  }
  .counter{
    margin-top:22px;font-size:15px;letter-spacing:.10em;color:var(--gold);
  }
  /* 數字由 hits.sh 產生（第三方圖片，無法改樣式，所以當成一枚金色籌碼內嵌） */
  .counter img{
    height:26px;width:auto;margin:0 5px;vertical-align:-7px;
  }
  .burn{
    margin-top:26px;font-size:clamp(16px,4.4vw,20px);line-height:1.85;
    color:var(--ink-2);letter-spacing:.03em;
  }
  figure{margin-top:34px}
  figure img{display:block;width:239px;max-width:100%;height:auto;margin:0 auto}
  .back{
    display:inline-block;margin-top:36px;text-decoration:none;
    font-size:13px;letter-spacing:.10em;color:var(--ink-3);
    border-bottom:1px solid rgba(184,145,42,.35);padding-bottom:2px;
  }
  .back:hover{color:var(--gold-deep);border-color:var(--gold)}
  @media (prefers-reduced-motion:reduce){h1{animation:none}}
</style>
</head>
<body>
<main>
  <h1>你被騙了</h1>

  <p class="counter" id="counterLine">你是第 <img id="hits" alt="人次"
    src="https://hits.sh/xn--fiqx8ydrbqw9ayt3clqh.com.svg?label=%20&color=B8912A&labelColor=B8912A"> 個被騙的</p>

  <p class="burn">你不會以為我傻到把聯絡資訊放在這裡吧</p>

  <figure>
    <img id="laugh" src="laugh.webp" width="239" height="230" alt="" decoding="async">
  </figure>

  <a class="back" href="./">返去</a>
</main>

<script>
(function () {
  'use strict';

  // 奶龍大笑圖：載不到（例如尚未放上）就整塊收起，免得見到爛圖示
  var laugh = document.getElementById('laugh');
  laugh.addEventListener('error', function () { laugh.parentNode.hidden = true; });
  if (laugh.complete && laugh.naturalWidth === 0) laugh.parentNode.hidden = true;

  // 人次數字來自 hits.sh（第三方），載不到就把整行收起，不露出半截句子
  var line = document.getElementById('counterLine');
  var hits = document.getElementById('hits');
  hits.addEventListener('error', function () { line.hidden = true; });
  if (hits.complete && hits.naturalWidth === 0) line.hidden = true;
})();
</script>
</body>
</html>
