  }
  .crest-tilt.tracking{transition:none}                    /* 跟隨期間關掉過渡，否則永遠追不上滑鼠 */
  .crest-tilt picture{display:block}
  .crest-tilt .crest-img{display:block;width:100%;height:auto;
                         -webkit-user-drag:none;user-select:none;transition:filter .2s}
  .crest-img.wiggle{animation:wig .58s ease}
  @keyframes wig{
    0%,100%{transform:rotate(0)}18%{transform:rotate(-4.5deg)}

  .crest-tilt img.eye{position:absolute;left:40.4444%;top:46.5074%;

    opacity:0;pointer-events:none;
    transition:opacity .16s ease, transform .26s cubic-bezier(.34,1.56,.64,1);
  }
  .bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
  .bubble::after{
    content:"";position:absolute;left:12px;bottom:-6.5px;width:10px;height:10px;background:#fff;

  }
  .rule{display:flex;align-items:center;justify-content:center;gap:10px;
        margin:24px auto 0;width:100%;max-width:360px}
  .rule::before,.rule::after{content:"";flex:1;height:1px;
        background:linear-gradient(90deg,transparent,var(--gold-line))}

  /* ---------------- 跳轉 ---------------- */
  .track{position:relative;margin-top:28px;padding-top:46px}
  .bar{height:4px;border-radius:99px;overflow:hidden;background:rgba(184,145,42,.16);
       box-shadow:inset 0 1px 2px rgba(112,86,16,.10)}

         background:linear-gradient(90deg,#D9B23F,var(--gold))}
  .runner-slot{position:absolute;bottom:2px;left:20px;width:40px;margin-left:-20px}
  .runner-slot img{display:block;width:40px;height:40px;animation:hop .38s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}

  /* ---- 攔路的小奶龍：倒數中途衝出來，把跑動那隻踢飛 ---- */
  .blocker-slot{
    position:absolute;bottom:2px;width:40px;margin-left:-20px;left:112%;
    opacity:0;pointer-events:none;z-index:4;
    transition:left .62s cubic-bezier(.35,0,.72,1), opacity .14s ease;
  }
  .blocker-slot img{display:block;width:40px;height:40px;transform:scaleX(-1);
                    animation:hop .26s ease-in-out infinite}
  .blocker-slot.on{opacity:1;left:var(--hit,52%)}
  .blocker-slot.landed img{animation-duration:.5s}
  .bbubble{
    position:absolute;left:50%;bottom:48px;z-index:7;
    transform:translate(-50%,6px) scale(.4);transform-origin:50% 100%;
    background:#fff;color:#7A5F10;font-size:12.5px;font-weight:700;letter-spacing:.06em;
    padding:6px 12px;border-radius:13px;border:1.5px solid rgba(184,145,42,.5);
    box-shadow:0 7px 18px rgba(112,86,16,.20);white-space:nowrap;
    opacity:0;pointer-events:none;
    transition:opacity .16s ease, transform .26s cubic-bezier(.34,1.56,.64,1);
  }
  .bbubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
  .bbubble::after{
    content:"";position:absolute;left:50%;bottom:-6.5px;margin-left:-5px;width:10px;height:10px;
    background:#fff;border-right:1.5px solid rgba(184,145,42,.5);
    border-bottom:1.5px solid rgba(184,145,42,.5);
    transform:rotate(45deg);border-bottom-right-radius:2px;
  }

  /* ---- 被踢飛的跑者 ---- */
  .runner-slot.kicked img{animation:none}
  .runner-slot.kicked{animation:knockoff .92s cubic-bezier(.22,-.25,.6,1) forwards;z-index:8}
  @keyframes knockoff{
    0%  {transform:translate(0,0) rotate(0)}
    18% {transform:translate(11px,-30px) rotate(34deg)}
    100%{transform:translate(300px,-120px) rotate(400deg);opacity:0}
  }

  .status{margin-top:16px;font-size:13px;letter-spacing:.05em;color:var(--ink-2)}
  .status b{color:var(--gold-deep);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}

  .acts{margin-top:20px}
  /* 全頁只剩一顆主按鈕：做大、佔滿寬度 */
  .acts #skip{
    display:block;width:100%;
    font-size:16.5px;letter-spacing:.18em;text-indent:.18em;

  }
  .acts #skip:hover{box-shadow:0 16px 34px rgba(112,86,16,.36), inset 0 1px 0 rgba(255,255,255,.24)}
  button{
    font:inherit;font-size:13.5px;font-weight:700;
    letter-spacing:.10em;text-indent:.10em;color:#FFF8E4;
    background:linear-gradient(180deg,#8E6D15,#7A5F10);
    border:0;border-radius:999px;padding:13px 30px;cursor:pointer;
    box-shadow:0 8px 20px rgba(112,86,16,.26), inset 0 1px 0 rgba(255,255,255,.18);
    transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
  }
  button:hover{transform:translateY(-2px);background:linear-gradient(180deg,#9C7917,#7F6311);
               box-shadow:0 12px 26px rgba(112,86,16,.32), inset 0 1px 0 rgba(255,255,255,.22)}
  button:active{transform:translateY(0)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  button.ghost{
    background:transparent;color:var(--gold-deep);box-shadow:none;
    padding:11px 24px;font-weight:400;font-size:13px;letter-spacing:.06em;
    border:1.5px solid rgba(184,145,42,.45);
  }
  button.ghost:hover{
    background:rgba(184,145,42,.10);border-color:var(--gold);
    transform:translateY(-1px);box-shadow:none;
  }
  button.ghost:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .status .mute{opacity:.75}

  .dest{margin-top:15px;font-size:11.5px;color:var(--ink-3);word-break:break-all}

  footer{margin-top:36px;padding-top:17px;border-top:1px solid rgba(184,145,42,.20);
         font-size:11px;line-height:1.9;color:var(--ink-3);letter-spacing:.02em}
  footer a{color:var(--gold-deep);text-underline-offset:3px}
  footer a:hover{color:var(--gold)}

  /* ---------------- D 落下的粒子 ---------------- */
  #fall{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5;
        contain:layout paint}
  .p{position:absolute;top:-70px;opacity:0;animation:fall linear forwards;
     will-change:transform,opacity}
  .p img{display:block;width:100%;opacity:.9}
  .p.dot{width:7px;height:7px;transform:rotate(45deg);
         background:linear-gradient(180deg,#EBCB6A,#B8912A);border-radius:2px;opacity:0}
  @keyframes fall{
    0%{opacity:0;transform:translateY(0) rotate(0)}
    14%{opacity:.85}
    80%{opacity:.85}
    100%{opacity:0;transform:translateY(112vh) rotate(220deg)}
  }

  /* ---------------- F 蓋章 ---------------- */
  #stamp{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
         pointer-events:none;background:rgba(252,248,236,0);
         transition:background .18s ease}
  #stamp.on{background:rgba(252,248,236,.80)}
  #stamp img{width:min(300px,60vw);opacity:0;
             filter:drop-shadow(0 20px 36px rgba(112,86,16,.34))}
  #stamp.on img{animation:slam .55s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes slam{
    0%{opacity:0;transform:scale(2.5) rotate(-7deg)}
    52%{opacity:1;transform:scale(.92) rotate(1.4deg)}
    74%{transform:scale(1.035) rotate(-.7deg)}
    100%{opacity:1;transform:scale(1) rotate(0)}
  }
  #stamp .ring{position:absolute;width:30px;height:30px;border-radius:50%;
               border:3px solid rgba(184,145,42,.7);opacity:0}
  #stamp.on .ring{animation:wave .55s ease-out forwards}
  @keyframes wave{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(11)}}

  @media (prefers-reduced-motion:reduce){
    .crest-tilt{transition:none}
    .crest-img.wiggle{animation:none}
    .runner-slot img{animation:none}
    .p{display:none}
    #stamp.on img{animation:none;opacity:1;transform:none}
    #stamp.on .ring{animation:none}
    button{transition:none}
  }
</style>

<script>
(function () {
  'use strict';

  var TARGET = 'https://www.nlsipess.edu.hk/';
  var TOTAL  = 4000;      // 倒數結束（現已改為停住，不再自動跳轉）
  var STAMP  = 3450;      // 蓋章時機（被攔截時會取消）
  var KICK   = 2480;      // 攔路小奶龍出場
  var HIT    = 3120;      // 撞上、跑者被踢飛

  var reduced = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var inFrame = false;
  try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  var hold = reduced || inFrame ||
             location.protocol === 'file:' ||
             /(^|[#&?])stay\b/.test(location.hash + location.search);

  var $ = function (id) { return document.getElementById(id); };
  var bar = $('bar'), sec = $('sec'), slot = $('slot'), status = document.querySelector('.status');
  var crest = $('crest'), tilt = $('crestTilt'), pupil = $('pupil'), bubble = $('bubble');
  var stamp = $('stamp'), fall = $('fall'), track = document.querySelector('.track');
  var smsg = $('smsg'), stime = $('stime'), skipBtn = $('skip');
  var runner = slot.querySelector('img');
  var stampImg = $('stampImg');
  var blocker = $('blocker'), bbubble = $('bbubble');
  var preview = hold;      // 預覽模式：只示範、不真的跳轉

  // 蓋章用的圖不在首屏，延後才載入（它本來會跟校徽搶頻寬、拖慢第一次渲染）
  var stampTimer = null;
  function armStamp() {
    if (stampImg && !stampImg.getAttribute('src') && stampImg.dataset.src) {
      stampImg.src = stampImg.dataset.src;
    }
  }
  function armStampSoon() {
    clearTimeout(stampTimer);
    stampTimer = setTimeout(armStamp, 1600);   // 3.45s 才用，留足 1.8s 下載
  }

  $('dest').textContent = TARGET;

  /* ---------------- 進度條 + 小奶龍 ---------------- */
  var startedAt = Date.now(), done = false, tStamp = null, tGo = null, ui = null;
  var tKick = null, tHit = null, kicked = false;

  function place(p) {                       // p: 0..1
    p = Math.max(0, Math.min(1, p));
    bar.style.width = (p * 100).toFixed(2) + '%';
    var tw = track.clientWidth, R = 20;     // 讓小奶龍一直留在軌道內
    slot.style.left = Math.round(R + p * (tw - 2 * R)) + 'px';
  }
  function stop() {
    if (tStamp) { clearTimeout(tStamp); tStamp = null; }
    if (tGo) { clearTimeout(tGo); tGo = null; }
    if (tKick) { clearTimeout(tKick); tKick = null; }
    if (tHit) { clearTimeout(tHit); tHit = null; }
    if (ui) { clearInterval(ui); ui = null; }
  }
  /* ---------------- 攔路：另一隻小奶龍衝出來，把跑動那隻踢飛 ---------------- */
  function resetBlock() {
    kicked = false;
    if (!slot || !blocker) return;
    blocker.classList.remove('on', 'landed');
    if (bbubble) bbubble.classList.remove('on');
    slot.classList.remove('kicked');
  }
  function startBlock() {
    if (done || staying || kicked || !blocker) return;
    var tw = track.clientWidth, R = 20;
    blocker.style.setProperty('--hit', Math.round(R + 0.60 * (tw - 2 * R)) + 'px');
    blocker.classList.add('on');
  }
  function kick() {
    if (done || staying || kicked || !slot || !blocker) return;
    kicked = true;
    blocker.classList.add('landed');
    slot.classList.add('kicked');
    if (bbubble) bbubble.classList.add('on');
    if (runner) runner.style.animationPlayState = '';
    if (tStamp) { clearTimeout(tStamp); tStamp = null; }
    if (ui) { clearInterval(ui); ui = null; }
  }

  function go() {
    if (done) return;
    done = true; stop();
    location.replace(TARGET);
  }

  /* ---------------- 小工具 ---------------- */
  var bubbleTimer = null;
  function say(text, ms) {
    bubble.textContent = text;
    bubble.classList.add('on');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () { bubble.classList.remove('on'); }, ms || 1300);
  }
  function wiggle() {
    crest.classList.remove('wiggle');
    void crest.offsetWidth;
    crest.classList.add('wiggle');
    crest.addEventListener('animationend', function h() {
      crest.classList.remove('wiggle'); crest.removeEventListener('animationend', h);
    });
  }
  function runPaused(p) {
    if (runner) runner.style.animationPlayState = p ? 'paused' : '';
  }
  function startDemo() {                    // 預覽模式用的慢速示範
    if (reduced) { place(1); return; }
    var t0 = Date.now();
    ui = setInterval(function () {
      var p = ((Date.now() - t0) % 5200) / 5200;
      place(p);
    }, 50);
  }

  /* ---------------- 先唔走 / 再倒數一次 ---------------- */
  var staying = false;

  function cancelGo() {
    if (done || staying) return;
    staying = true;
    stop();
    stamp.classList.remove('on');
    runPaused(true);
    skipBtn.textContent = '好啦，去官網 →';
    if (preview) {
      smsg.textContent = '預覽模式：已停用自動跳轉';
      stime.hidden = true;
    } else {
      smsg.textContent = '好，唔走住';
      stime.hidden = true;
    }
    say('終於有人陪', 1900);
  }

  function restartGo() {
    if (done || !staying) return;
    staying = false;
    stop();
    resetBlock();
    stamp.classList.remove('on');
    runPaused(false);
    skipBtn.textContent = '唔等喇，而家就去 →';
    if (preview) {
      smsg.textContent = '預覽模式：已停用自動跳轉（小奶龍示範跑動中）';
      stime.hidden = true;
      startDemo();
      return;
    }
    startedAt = Date.now();
    smsg.textContent = '正在前往本校正式網站';
    stime.hidden = false;
    armStampSoon();
    tStamp = setTimeout(function () { armStamp(); stamp.classList.add('on'); }, STAMP);
    // 倒數走完不再自動跳走 —— 改為「停住」，由訪客自己決定去唔去。
    // 這是主頁能被搜尋引擎收錄的前提：頁面不可以自己導航走。
    tGo = setTimeout(cancelGo, TOTAL);
    tKick = setTimeout(startBlock, KICK);
    tHit  = setTimeout(kick, HIT);
    ui = setInterval(paint, 50);
    paint();
  }

  skipBtn.addEventListener('click', go);            // 主按鈕永遠是「去」

  /* ---------------- A 眼睛全頁跟隨滑鼠 + 校徽微轉 ---------------- */
  var outer = document.querySelector('.crest-outer');
  var pupilMax = 0, cx = 0, cy = 0, reach = 1;
  var px = 0, py = 0, raf = 0, tracking = false;

  function measure() {
    // 量沒有被 3D 旋轉污染的「外框」，取中心點
    var r = outer.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;
    reach = Math.max(window.innerWidth, window.innerHeight) * 0.42;
    pupilMax = pupil.getBoundingClientRect().width * 0.17;
  }

  function apply() {
    raf = 0;
    var dx = px - cx, dy = py - cy;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var f = Math.min(1, len / reach);
    var nx = (dx / len) * f, ny = (dy / len) * f;

    pupil.style.transform = 'translate(' + (nx * pupilMax).toFixed(2) + 'px,' +
                                            (ny * pupilMax).toFixed(2) + 'px)';
    if (!reduced) {
      tilt.style.transform = 'rotateY(' + (nx * 3.2).toFixed(2) + 'deg) rotateX(' +
                                          (-ny * 3.2).toFixed(2) + 'deg)';
    }
  }

  // 不管滑鼠回報多快，一幀只重算一次；也不再每次讀 getBoundingClientRect
  function moveTo(x, y) {
    px = x; py = y;
    if (!raf) raf = requestAnimationFrame(apply);
    if (!tracking) { tracking = true; tilt.classList.add('tracking'); }
  }
  function rest() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (tracking) { tracking = false; tilt.classList.remove('tracking'); }
    pupil.style.transform = '';
    tilt.style.transform = '';
  }

  measure();
  window.addEventListener('load', measure);
  window.addEventListener('resize', measure, { passive: true });
  window.addEventListener('scroll', measure, { passive: true });
  window.addEventListener('pointermove', function (e) { moveTo(e.clientX, e.clientY); },
                          { passive: true });
  window.addEventListener('pointerdown', function (e) { moveTo(e.clientX, e.clientY); },
                          { passive: true });
  window.addEventListener('blur', rest);
  document.addEventListener('mouseleave', rest);

  /* ---------------- B 點一下冒句話 ---------------- */
  var LINES = ['哇', '做咩篤我', '痛啊', '靚仔，等陣先', '學校喺下面'];
  tilt.addEventListener('click', function () {
    wiggle();
    say(LINES[Math.floor(Math.random() * LINES.length)], 1300);
  });

  /* ---------------- D 開場落下的奶龍同金粒 ---------------- */
  if (!reduced) {
    var n = window.innerWidth < 520 ? 9 : 14;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var d = document.createElement('div');
      var dragon = i % 3 !== 2;
      d.className = 'p' + (dragon ? '' : ' dot');
      if (dragon) {
        var s = Math.round(13 + Math.random() * 8);
        d.style.width = s + 'px';
        d.style.height = s + 'px';
        d.innerHTML = '<img src="run.png" alt="">';
      }
      d.style.left = (Math.random() * 94 + 3).toFixed(1) + '%';
      d.style.animationDuration = (2.4 + Math.random() * 2.0).toFixed(2) + 's';
      d.style.animationDelay = (Math.random() * 1.1).toFixed(2) + 's';
      frag.appendChild(d);
    }
    fall.appendChild(frag);
    setTimeout(function () { fall.innerHTML = ''; }, 6000);
  }

  /* ---------------- 主流程 ---------------- */
  function paint() {
    var left = Math.max(0, TOTAL - (Date.now() - startedAt));
    place(1 - left / TOTAL);
    sec.textContent = Math.ceil(left / 1000);
  }

  console.log('%c🐲 香港奶龍中學 %c 彩蛋',
    'background:#B8912A;color:#FCF8EC;padding:2px 6px;border-radius:3px;font-weight:700',
    'color:#8A6A12');

  if (preview) {
    // 預覽模式：不跳轉，改用慢速示範一圈，方便檢視小奶龍跑動
    place(1);
    smsg.textContent = '預覽模式：已停用自動跳轉（小奶龍示範跑動中）';
    stime.hidden = true;
    startDemo();
    return;
  }

  armStampSoon();
  tStamp = setTimeout(function () { armStamp(); stamp.classList.add('on'); }, STAMP);
  tGo = setTimeout(cancelGo, TOTAL);
  tKick = setTimeout(startBlock, KICK);
  tHit  = setTimeout(kick, HIT);
  ui = setInterval(paint, 50);
  paint();
})();
</script>
</body>
</html>
